<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools Collection</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#0d0d0d; color:#e0e0e0; padding:20px; max-width:800px; margin:0 auto; }
.header { margin-bottom:25px; }
.header h1 { font-size:24px; color:#fff; margin-bottom:5px; }
.header p { font-size:14px; color:#888; }
.search-container { margin-bottom:20px; position:relative; }
.search-container input { width:100%; padding:12px 15px 12px 40px; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff; font-size:14px; outline:none; }
.search-container i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#666; }
.website-list { display:flex; flex-direction:column; gap:15px; }
.card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:15px; display:flex; align-items:center; justify-content:space-between; gap:15px; transition:border-color .2s; }
.card:hover { border-color:#444; }
.card-left { display:flex; align-items:center; gap:15px; overflow:hidden; }
.card-logo { width:48px; height:48px; border-radius:10px; object-fit:cover; background:#2a2a2a; flex-shrink:0; }
.card-title { font-size:16px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-actions { display:flex; gap:8px; flex-shrink:0; }
.btn { padding:8px 12px; border-radius:6px; border:none; font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; text-decoration:none; transition:background .2s; }
.btn-copy { background:#2a2a2a; color:#e0e0e0; }
.btn-copy:hover { background:#3a3a3a; }
.btn-open { background:#fff; color:#000; }
.btn-open:hover { background:#ccc; }
.tooltip { position:relative; }
.tooltip .tooltiptext { visibility:hidden; width:80px; background:#333; color:#fff; text-align:center; border-radius:6px; padding:5px; position:absolute; z-index:1; bottom:125%; left:50%; margin-left:-40px; opacity:0; transition:opacity .3s; font-size:12px; }
.tooltip.show .tooltiptext { visibility:visible; opacity:1; }
.empty-state { text-align:center; padding:40px; color:#555; font-size:14px; }
@media (max-width:500px) {
  .card { flex-direction:column; align-items:flex-start; gap:12px; }
  .card-left { width:100%; }
  .card-actions { width:100%; justify-content:flex-end; }
  .btn { flex:1; justify-content:center; }
}
</style>
</head>
<body>
<div class="header">
<h1>Tools Collection</h1>
<p>Koleksi website pribadi.</p>
</div>
<div class="search-container">
<i class="fas fa-search"></i>
<input type="text" id="searchInput" placeholder="Cari website...">
</div>
<div class="website-list" id="websiteList"></div>

<script>
const websites = [
    {
        "name": "Pusat Item",
        "logo": "https://uploader.xixy.my.id/1790773130083.jpeg",
        "url": "https://Pusatitem.web.id"
    },
    {
        "name": "Media Converter",
        "logo": "https://uploader.xixy.my.id/1790773396467.jpeg",
        "url": "https://mediaconverter-pi.vercel.app/"
    },
    {
        "name": "Colorkit - Pro",
        "logo": "https://uploader.xixy.my.id/1790773525918.jpeg",
        "url": "https://colorkit-pro.vercel.app/"
    },
    {
        "name": "Catatan - Pemasukan Dan Pengeluaranmu",
        "logo": "https://uploader.xixy.my.id/1790773738624.jpeg",
        "url": "https://catat-keuanganmu.vercel.app/"
    },
    {
        "name": "HD - Video Dan Foto",
        "logo": "https://uploader.xixy.my.id/1790773852338.jpeg",
        "url": "https://ubahvddanftmenjadihd.vercel.app/"
    }
];

const websiteList = document.getElementById('websiteList');
const searchInput = document.getElementById('searchInput');

function renderWebsites(data) {
    websiteList.innerHTML = '';
    if (data.length === 0) {
        websiteList.innerHTML = '<div class="empty-state">Belum ada website.</div>';
        return;
    }
    data.forEach(site => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-left">
                <img src="${site.logo}" alt="${site.name}" class="card-logo" onerror="this.src='https://via.placeholder.com/100x100/1a1a1a/ffffff?text=?'">
                <div class="card-title">${site.name}</div>
            </div>
            <div class="card-actions">
                <button class="btn btn-copy tooltip" onclick="copyToClipboard('${site.url}', this)">
                    <i class="fas fa-copy"></i> Salin
                    <span class="tooltiptext">Tersalin!</span>
                </button>
                <a href="${site.url}" target="_blank" class="btn btn-open">
                    <i class="fas fa-external-link-alt"></i> Open
                </a>
            </div>
        `;
        websiteList.appendChild(card);
    });
}

function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('show');
        setTimeout(() => btn.classList.remove('show'), 1500);
    }).catch(err => {
        console.error(err);
        alert('Gagal menyalin URL.');
    });
}

searchInput.addEventListener('input', e => {
    const kw = e.target.value.toLowerCase();
    renderWebsites(websites.filter(s => s.name.toLowerCase().includes(kw)));
});

renderWebsites(websites);
</script>
</body>
</html>
