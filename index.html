<title>Tools Collection</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body { background:#0d0d0d; color:#e0e0e0; padding:20px; max-width:800px; margin:0 auto; }
.header { margin-bottom:25px; }
.header h1 { font-size:24px; color:#fff; margin-bottom:5px; }
.header p { font-size:14px; color:#888; }
.search-container { margin-bottom:20px; position:relative; }
.search-container input { width:100%; padding:12px 15px 12px 40px; background:#1a1a1a; border:1px solid #333; border-radius:8px; color:#fff; font-size:14px; outline:none; }
.search-container i { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#666; }
.website-list { display:flex; flex-direction:column; gap:15px; }
.card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:15px; display:flex; align-items:center; justify-content:space-between; gap:15px; }
.card-left { display:flex; align-items:center; gap:15px; overflow:hidden; min-width:0; }
.card-logo { width:48px; height:48px; border-radius:10px; object-fit:cover; background:#2a2a2a; flex-shrink:0; }
.card-title { font-size:16px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-actions { display:flex; gap:8px; flex-shrink:0; }
.btn { padding:8px 12px; border-radius:6px; border:none; font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; text-decoration:none; }
.btn-copy { background:#2a2a2a; color:#e0e0e0; }
.btn-open { background:#fff; color:#000; }
.empty-state { text-align:center; padding:40px; color:#555; }
@media (max-width:500px) {
  .card { flex-direction:column; align-items:flex-start; gap:12px; }
  .card-left { width:100%; }
  .card-actions { width:100%; justify-content:flex-end; }
  .btn { flex:1; justify-content:center; }
}
</style>

var list = document.getElementById("websiteList");
var search = document.getElementById("searchInput");

function renderWebsites(arr) {
    list.innerHTML = "";
    if (arr.length === 0) {
        list.innerHTML = '<div class="empty-state">Belum ada website.</div>';
        return;
    }
    for (var i = 0; i < arr.length; i++) {
        (function(site) {
            var card = document.createElement("div");
            card.className = "card";

            var left = document.createElement("div");
            left.className = "card-left";

            var img = document.createElement("img");
            img.className = "card-logo";
            img.src = site.logo || "https://via.placeholder.com/100x100/1a1a1a/ffffff?text=?";
            img.alt = site.name;
            img.onerror = function() { this.src = "https://via.placeholder.com/100x100/1a1a1a/ffffff?text=?"; };

            var title = document.createElement("div");
            title.className = "card-title";
            title.textContent = site.name;

            left.appendChild(img);
            left.appendChild(title);

            var actions = document.createElement("div");
            actions.className = "card-actions";

            var btnCopy = document.createElement("button");
            btnCopy.className = "btn btn-copy";
            btnCopy.innerHTML = '<i class="fas fa-copy"></i> Salin';
            btnCopy.onclick = function() {
                var self = this;
                function done() {
                    self.innerHTML = '<i class="fas fa-check"></i> Tersalin';
                    setTimeout(function() { self.innerHTML = '<i class="fas fa-copy"></i> Salin'; }, 1500);
                }
                function fallback() {
                    var ta = document.createElement("textarea");
                    ta.value = site.url; ta.style.position = "fixed"; ta.style.left = "-9999px";
                    document.body.appendChild(ta); ta.select();
                    try { document.execCommand("copy"); done(); } catch(e) {}
                    document.body.removeChild(ta);
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(site.url).then(done).catch(fallback);
                } else { fallback(); }
            };

            var btnOpen = document.createElement("a");
            btnOpen.className = "btn btn-open";
            btnOpen.href = site.url;
            btnOpen.target = "_blank";
            btnOpen.innerHTML = '<i class="fas fa-external-link-alt"></i> Open';

            actions.appendChild(btnCopy);
            actions.appendChild(btnOpen);

            card.appendChild(left);
            card.appendChild(actions);
            list.appendChild(card);
        })(arr[i]);
    }
}

search.addEventListener("input", function(e) {
    var kw = e.target.value.toLowerCase();
    var filtered = websites.filter(function(s) { return s.name.toLowerCase().indexOf(kw) !== -1; });
    renderWebsites(filtered);
});

renderWebsites(websites);
</script>
</body>
